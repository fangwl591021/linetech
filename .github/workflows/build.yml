name: Build Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Preserve rich menu visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-menu-visual-review
          path: test-results/**/taiwan-rich-menu-*.png
          if-no-files-found: ignore
